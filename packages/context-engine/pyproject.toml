[project]
name = "context-engine"
version = "0.1.0"
description = "Deep context engine and code intelligence for the OrchestronAI agentic IDE"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alexandru Achille Flueraru" }]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
